# Retrieval evaluation set for the product knowledge corpus.
#
#   env/Scripts/python.exe scripts/eval_knowledge_retrieval.py
#   env/Scripts/python.exe scripts/eval_knowledge_retrieval.py --sweep
#
# `questions` are real product questions, each labelled with the corpus document
# title(s) that answer it. Phrasing is deliberately mixed: some formal, some the way
# a user actually types — lowercase, misspelled, partial. Retrieval that only works
# on well-formed questions is not working.
#
# `controls` are plausible questions the corpus does NOT answer. They must retrieve
# nothing, so the assistant falls back to "I don't have that documented" instead of
# improvising. A control that starts matching is a regression.

