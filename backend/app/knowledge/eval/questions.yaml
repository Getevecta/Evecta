  # --- short forms, observed in live testing 2026-08-14 -----------------------
  # The set above is written in fuller sentences than users actually type. Every
  # entry here is a terse or abbreviated phrasing of a question the corpus does
  # answer; two of them ("who are u ?", "what is included in the Growth plan")
  # were rejected in live testing at threshold 0.71 despite ranking the correct
  # chunk first. Short queries carry less distinctive signal, so they land lower
  # than their long-form equivalents — the set has to contain them or the sweep
  # calibrates against phrasing no real user produces.
  - q: who are u
    documents: [What Evecta is and who it is for]
  - q: what can u do
    documents: [What Evecta is and who it is for]
  - q: what is included in the growth plan
    documents: [Plans and pricing]
  - q: growth plan
    documents: [Plans and pricing]
  - q: price
    documents: [Plans and pricing]
  - q: find leads
    documents: [Generating leads]
  - q: how 2 find leads
    documents: [Generating leads]
  # Regression: the credits chunk "Is one lead equal to one credit?" outranks the
  # right answer on this phrasing (0.7207 vs 0.7077), so the per-chunk floor passed
  # the wrong passage alone and dropped the correct one 0.003 below it. The reply
  # was a refusal built from a passage about credit accounting.
  - q: How do u find the leads
    documents: [Generating leads]
  - q: connect gmail
    documents: [Mailbox setup and connection troubleshooting, Connecting your mailbox]
  - q: gmail not connecting
    documents: [Mailbox setup and connection troubleshooting]
  - q: where r my replies
    documents: [Unified Inbox and replies]
  - q: daily limit
    documents: [Sending limits and campaign delivery pace]
  - q: credits left
    documents: [Credits and billing]
  - q: spam check
    documents: [Spam Check]
  - q: warmed emails
    documents: [Warmed email addresses]

controls:
  # Plausible, adjacent to real documents, but genuinely not covered.
  - q: are you SOC 2 certified
  - q: what is your uptime SLA
  - q: which region is my data stored in
  - q: are you GDPR compliant
  - q: can I export my leads straight to Salesforce
  - q: do you integrate with HubSpot
  - q: is there an API I can call
  - q: do you have a mobile app
  - q: can I send outreach on LinkedIn
  - q: can I A/B test two subject lines
  - q: what is your refund policy
  - q: can I white label Evecta for my clients
  - q: do you support SMS or cold calling
  - q: how do I set up a custom tracking domain

  # Short forms of uncovered topics. These balance the short-form questions
  # above: without them the sweep only sees terse phrasing on the positive side
  # and would lower the threshold to catch it, with no counterweight measuring
  # what that costs in false matches.
  - q: hubspot
  - q: salesforce
  - q: api
  - q: mobile app
  - q: refund
  - q: linkedin outreach
