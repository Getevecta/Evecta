# Prevent caching of index.html so users always get fresh HTML and correct script URLs.
# Without this, after each deploy users with cached index.html get a blank page because
# the old HTML references JS/CSS filenames that no longer exist (404).
#
# Option A: If you have a location / that serves the SPA, add these headers to the
# block that serves index.html (e.g. where you have try_files ... /index.html):
#
#   add_header Cache-Control "no-cache, no-store, must-revalidate";
#   add_header Pragma "no-cache";
#   add_header Expires "0";
#
# Option B: Add separate locations for document requests so only HTML is no-cache:
# (Hashed assets under /assets/ can stay cached.)

location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files /index.html =404;
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}
